services:
  - type: web
    name: taller3-vision-artificial
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "uvicorn Modelos_ML.Visionartificial.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: PORT
        value: "10000"
    healthCheckPath: /health
