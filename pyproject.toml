[tool.vercel]
# =====================================================================
# Entrypoint EXPLICITO para Vercel (evita autodeteccion erronea de
# FastAPI / Django, ya que los archivos asgi.py / wsgi.py del
# Modelo 2 (RegresionLineal/frontend/) hacen que Vercel intente
# asignar presets equivocados como 'techgear_api.main:app').
#
# NUESTRO backend real del despliegue RAIZ es Flask Serverless en:
#   api/index.py   ->   variable Flask: app
# =====================================================================
entrypoint = "api/index:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taller3-visionml"
version = "1.0.0"
description = "Taller 3 Machine Learning SENA - Modelo 1: Vision Artificial (Deteccion Rostros) desplegado en Vercel con Flask Serverless"
readme = "README.MD"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jonathan Martinez" }]
license = { text = "MIT" }
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "opencv-python-headless>=4.9.0,<6.0.0",
    "numpy>=1.26.0,<2.2.0"
]

[tool.setuptools.packages.find]
include = ["api*"]
